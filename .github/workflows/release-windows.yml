name: Release Windows Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - name: Build Tauri portable
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage portable artifact
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/x86_64-pc-windows-msvc/release/TraceLab.exe release/TraceLab-portable.exe
          ls -lh release/TraceLab-portable.exe

      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "tag=v${version}-${short}" >> "$GITHUB_OUTPUT"
          echo "name=TraceLab v${version} (${short})" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          files: release/TraceLab-portable.exe
          make_latest: "true"
          generate_release_notes: true
