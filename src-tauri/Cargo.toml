[package]
name = "tracelab"
version = "0.1.0"
description = "TraceLab desktop wrapper"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "TraceLab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
